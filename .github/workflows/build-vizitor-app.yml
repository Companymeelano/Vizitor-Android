# ═══════════════════════════════════════════════════════════════════════════
#  ساخت و انتشار APK برنامهٔ «آتیران ویزیتور» با اتصال مستقیم SQL Server
#
#  این ورک‌فلو پروژهٔ کامل اندروید (پوشهٔ vizitor-app) را می‌سازد:
#    • لایهٔ اتصال مستقیم روی پورت ۱۴۳۳ (mssql-jdbc + jTDS)
#    • خواندن جدول/ستون‌های ویزیتورها (dbo.sys_vis → dbo.visitors)
#    • صفحهٔ «اتصال مستقیم SQL» هماهنگ با کارت اتصال نصب‌کنندهٔ ویندوز
#
#  روی خطا، لاگ کامل بیلد در vizitor-app/build.log داخل مخزن ثبت می‌شود تا
#  عیب‌یابی بدون دسترسی به لاگ Actions ممکن باشد.
# ═══════════════════════════════════════════════════════════════════════════
name: Build Vizitor Android app (direct SQL)

env:
  # نام نسخهٔ برنامه — همهٔ نام فایل‌ها/تگ ریلیز از همین یک مقدار ساخته می‌شوند
  APP_VERSION: "2.23.0"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      # فقط کد و پیکربندی بیلد؛ تغییر README/مستندات/خروجی‌ها نباید APK را بازسازی کند
      - "vizitor-app/app/**"
      - "vizitor-app/build.gradle.kts"
      - "vizitor-app/settings.gradle.kts"
      - "vizitor-app/gradle.properties"
      - "vizitor-app/gradle/**"
      - "vizitor-app/gradlew"
      - ".github/workflows/build-vizitor-app.yml"

permissions:
  contents: write

concurrency:
  group: vizitor-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: نمایش نسخهٔ ابزارها
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: آماده‌سازی کلید امضای پایدار
        working-directory: vizitor-app
        env:
          KEY_B64: ${{ secrets.VIZITOR_APP_KEY_B64 }}
          KEY_PASS: ${{ secrets.VIZITOR_APP_KEY_PASS }}
        run: |
          set -e
          PASS="${KEY_PASS:-vizitorappci}"
          if [ -n "${KEY_B64}" ]; then
            echo "کلید اختصاصی از Secret مخزن خوانده شد ✓"
            printf '%s' "${KEY_B64}" | base64 -d > app-key.p12
            SRC=app-key.p12
          else
            echo "کلید امضای پایدار مخزن استفاده می‌شود (vizitor-app/vizitor-app-signing.p12)"
            SRC=vizitor-app-signing.p12
          fi
          keytool -list -keystore "$SRC" -storetype PKCS12 -storepass "$PASS" | head -6
          ALIAS=$(keytool -list -keystore "$SRC" -storetype PKCS12 -storepass "$PASS" \
                    | grep -m1 "PrivateKeyEntry" | cut -d, -f1 | tr -d ' \r')
          echo "alias=$ALIAS"
          keytool -importkeystore -noprompt \
            -srckeystore "$SRC" -srcstoretype PKCS12 -srcstorepass "$PASS" \
            -destkeystore vizitor-app-ci.jks -deststoretype JKS -deststorepass "$PASS" -destkeypass "$PASS"
          printf 'storeFile=vizitor-app-ci.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PASS" "$ALIAS" "$PASS" > keystore.properties
          cat keystore.properties
          ls -l vizitor-app-ci.jks

      - name: ساخت APK (debug و release)
        working-directory: vizitor-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          # دو طعم ساخت با یک سورس: vizitor (کامل) و mreport (انحصاری گزارشات مدیر)
          ./gradlew --no-daemon --stacktrace :app:assembleVizitorRelease :app:assembleVizitorDebug \
            :app:assembleMreportRelease 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::ساخت APK شکست خورد — لاگ کامل در vizitor-app/build.log ثبت می‌شود"
            {
              echo "لاگ شکست بیلد برنامهٔ ویزیتور — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "=================================================================="
              grep -aE "^e: |error:|FAILURE|Execution failed|> Task .*FAILED|What went wrong|Caused by" build.log | head -80
              echo ""
              echo "--- ۱۲۰ خط آخر ---"
              tail -120 build.log
            } > build-failure.txt
            cat build-failure.txt
            # خطاهای اصلی به‌صورت annotation ثبت می‌شوند تا از API قابل خواندن باشند
            grep -aE "^e: |error:|FAILURE|Execution failed|What went wrong|Caused by|Unresolved" build.log | head -8 | while IFS= read -r ln; do
              echo "::error::$(printf '%s' "$ln" | tr '\r\n' '  ' | cut -c1-900)"
            done
            # ثبت لاگ در مخزن (مسیرها نسبت به ریشهٔ مخزن محاسبه می‌شوند)
            cd "$GITHUB_WORKSPACE"
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            rm -rf /tmp/cargo && mkdir -p /tmp/cargo
            cp vizitor-app/build-failure.txt /tmp/cargo/
            URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            pushed=0
            for try in 1 2 3; do
              git fetch -q "$URL" "refs/heads/${GITHUB_REF_NAME}" || true
              git reset --hard FETCH_HEAD
              cp /tmp/cargo/build-failure.txt vizitor-app/build-failure.txt
              git add -f vizitor-app/build-failure.txt
              if git diff --cached --quiet; then
                echo "::warning::چیزی برای ثبت نبود (مرحلهٔ add چیزی برنگرداند)"
                break
              fi
              git commit -q -m "chore(ci): vizitor-app build failure log [skip ci]"
              if git push "$URL" "HEAD:refs/heads/${GITHUB_REF_NAME}"; then pushed=1; break; fi
              echo "پوش رد شد (تلاش $try)"
              sleep 4
            done
            [ "$pushed" = "1" ] && echo "لاگ خطا در مخزن ثبت شد ✓" || echo "::warning::لاگ خطا در مخزن ثبت نشد"
            exit "$rc"
          fi

      - name: آماده‌سازی خروجی‌ها
        working-directory: vizitor-app
        run: |
          set -e
          mkdir -p dist
          VREL=app/build/outputs/apk/vizitor/release/app-vizitor-release.apk
          VDBG=app/build/outputs/apk/vizitor/debug/app-vizitor-debug.apk
          MREL=app/build/outputs/apk/mreport/release/app-mreport-release.apk
          cp "$VREL" "dist/Vizitor-$APP_VERSION-direct.apk"
          cp "$VDBG" "dist/Vizitor-$APP_VERSION-direct-debug.apk"
          cp "$MREL" "dist/MReport-$APP_VERSION-direct.apk"
          # فقط سطر نسخهٔ اصلی در فایل .sha256 (نام فایل با نام همان APK یکی است)
          cd dist && sha256sum "Vizitor-$APP_VERSION-direct.apk" > "Vizitor-$APP_VERSION-direct.apk.sha256" \
                    && sha256sum "MReport-$APP_VERSION-direct.apk" > "MReport-$APP_VERSION-direct.apk.sha256" \
                    && sha256sum *.apk > SHA256SUMS.txt
          ls -l

      - name: گزارش بازرسی APK (در مخزن ثبت می‌شود)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools"
          APKSIGNER=$(ls -d "$BT"/*/apksigner 2>/dev/null | tail -1)
          R=vizitor-app/apk-report.txt
          {
            echo "گزارش ساخت APK برنامهٔ آتیران ویزیتور با اتصال مستقیم SQL Server (پورت ۱۴۳۳)"
            echo "تاریخ: $(date -u '+%Y-%m-%d %H:%M:%S UTC')   کامیت: ${GITHUB_SHA}"
            echo "=================================================================================="
            echo ""
            echo "--- خروجی بیلد (Gradle) ---"
            tail -12 vizitor-app/build.log
            echo ""
            echo "### اثر انگشت گواهی امضا (ثابت بین بیلدها)"
            keytool -list -v -keystore vizitor-app/vizitor-app-signing.p12 -storetype PKCS12 \
              -storepass "${KEY_PASS:-vizitorappci}" 2>/dev/null | grep -E "Alias name|Valid from|SHA256:" | head -4
            echo ""
            for f in vizitor-app/dist/*.apk; do
              echo "### $(basename "$f")"
              stat -c 'حجم: %s بایت' "$f"
              grep -a "$(basename "$f")" vizitor-app/dist/*.sha256 2>/dev/null
              echo ""
              echo "--- مشخصات نسخه و پکیج (aapt2) ---"
              AAPT2=$(ls -d "$BT"/*/aapt2 2>/dev/null | tail -1)
              [ -n "$AAPT2" ] && "$AAPT2" dump badging "$f" 2>/dev/null \
                | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion|native-code" | head -6
              echo ""
              echo "--- تأیید امضا ---"
              "$APKSIGNER" verify --verbose --print-certs "$f" 2>&1 | head -18
              echo ""
              echo "--- تعداد dex و حضور درایورهای SQL ---"
              unzip -l "$f" | grep -c "classes.*\.dex"
              mkdir -p /tmp/dexcheck && rm -f /tmp/dexcheck/*
              unzip -o -q "$f" "classes*.dex" -d /tmp/dexcheck 2>/dev/null
              for needle in "com/microsoft/sqlserver/jdbc/SQLServerDriver" "net/sourceforge/jtds/jdbc/Driver" \
                            "ir/atiran/vizitor/sqldirect/VisitorRepository" "ir/atiran/vizitor/ui/screens/DirectSqlScreen" \
                            "ir/atiran/vizitor/sqldirect/SqlDiagnostics" "ir/atiran/vizitor/sqldirect/SqlConnectionManager" \
                            "ir/atiran/vizitor/sqldirect/DirectSql" "ir/atiran/vizitor/sqldirect/SecureDbStore" \
                            "ir/atiran/vizitor/sqldirect/VisitRepository" "ir/atiran/vizitor/ui/screens/VisitScreen" \
                            "ir/atiran/vizitor/sqldirect/VisitViewModel" \
                            "ir/atiran/vizitor/sqldirect/MaSqlEngine" "ir/atiran/vizitor/sqldirect/MaMapping" \
                            "ir/atiran/vizitor/sqldirect/MaSectionStore" "ir/atiran/vizitor/ui/screens/manager/MaManagerScreen" \
                  "ir/atiran/vizitor/ui/screens/manager/MReportHome" \
                  "ir/atiran/vizitor/sqldirect/MaServerProfile"; do
                n=$(cat /tmp/dexcheck/*.dex 2>/dev/null | strings | grep -c "$needle")
                echo "  $needle : $n"
              done
              echo ""
              echo "--- رشته‌های فارسی بخش «گزارش مدیریت» و خانهٔ «M•A Report» در DEX ---"
              for fa in "گزارش مدیریت" "اتصال جداول" "عیب‌یابی اتصال" "برترین‌ها" "فقط-خواندنی" "لمس برای انتخاب جدول" \
              "نبض کسب‌وکار" "پرونده مشتریان" "خزانه" "اعلان‌ها" "M•A Report" \
              "اتصال خودکار" "ورود و همگام‌سازی" "ورود کاربر آتیران"; do
                n=$(cat /tmp/dexcheck/*.dex 2>/dev/null | grep -ac "$fa")
                echo "  $fa : $n"
              done
            done
          } > "$R"
          cat "$R"
          git config user.name "vizitor-ci"
          git config user.email "ci@vizitor.local"
          rm -rf /tmp/cargo && mkdir -p /tmp/cargo && cp "$R" /tmp/cargo/
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for try in 1 2 3; do
            git fetch -q "$URL" "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            cp /tmp/cargo/apk-report.txt vizitor-app/apk-report.txt
            for f in vizitor-app/apk-report.txt; do [ -f "$f" ] && git add -f "$f"; done
            git diff --cached --quiet && { echo "چیزی برای ثبت نبود"; break; }
            git commit -q -m "chore(ci): vizitor-app APK report [skip ci]"
            if git push "$URL" "HEAD:${GITHUB_REF_NAME}"; then echo "گزارش ثبت شد ✓"; break; fi
            sleep 4
          done

      - name: ثبت APK امضاشده در مخزن (دسترسی از git/API، مستقل از artifact)
        # ⚠️ مهم: این گام فایل را از «خروجی خودِ Gradle» برمی‌دارد، نه از dist/؛
        # چون گام‌های قبلی با git reset --hard، پوشهٔ dist/ را به نسخهٔ داخل گیت برمی‌گردانند
        # و اگر از dist/ بخوانیم، APK بیلد قبلی ثبت/منتشر می‌شود.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REL=vizitor-app/app/build/outputs/apk/vizitor/release/app-vizitor-release.apk
          DBG=vizitor-app/app/build/outputs/apk/vizitor/debug/app-vizitor-debug.apk
          MREL=vizitor-app/app/build/outputs/apk/mreport/release/app-mreport-release.apk
          R1=vizitor-app/dist/Vizitor-$APP_VERSION-direct.apk
          R2=vizitor-app/dist/Vizitor-$APP_VERSION-direct.apk.sha256
          R3=vizitor-app/dist/BUILD-INFO.txt
          R4=vizitor-app/dist/SHA256SUMS.txt
          rm -rf /tmp/cargo3 && mkdir -p /tmp/cargo3
          cp "$REL" /tmp/cargo3/apk || { echo "::warning::خروجی نسخهٔ اصلی پیدا نشد"; exit 0; }
          HASH=$(sha256sum /tmp/cargo3/apk | cut -d' ' -f1)
          printf '%s  Vizitor-%s-direct.apk\n' "$HASH" "$APP_VERSION" > /tmp/cargo3/sha
          : > /tmp/cargo3/sums
          if [ -f "$DBG" ]; then
            printf '%s  Vizitor-%s-direct-debug.apk\n' "$(sha256sum "$DBG" | cut -d' ' -f1)" "$APP_VERSION" >> /tmp/cargo3/sums
          fi
          printf '%s  Vizitor-%s-direct.apk\n' "$HASH" "$APP_VERSION" >> /tmp/cargo3/sums
          MHASH=""
          if [ -f "$MREL" ]; then
            MHASH=$(sha256sum "$MREL" | cut -d' ' -f1)
            printf '%s  MReport-%s-direct.apk\n' "$MHASH" "$APP_VERSION" >> /tmp/cargo3/sums
            printf '%s  MReport-%s-direct.apk\n' "$MHASH" "$APP_VERSION" > /tmp/cargo3/msha
            cp "$MREL" /tmp/cargo3/mapk
          fi
          {
            echo "Vizitor-$APP_VERSION-direct.apk  (آتیران ویزیتور — نسخه $APP_VERSION با اتصال مستقیم SQL)"
            echo "تاریخ ساخت: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "کامیت: ${GITHUB_SHA}"
            echo "حجم: $(stat -c %s /tmp/cargo3/apk) بایت"
            echo "sha256: ${HASH}"
            echo "امضا: بررسی‌شده با apksigner — جزئیات در vizitor-app/apk-report.txt"
            echo "بررسی صحت فایل‌های همین پوشه: sha256sum -c --ignore-missing SHA256SUMS.txt"
            echo "توجه: نسخهٔ آزمون (debug) فقط به ریلیز ضمیمه می‌شود و در مخزن نگه‌داری نمی‌شود؛"
            echo "      برای بررسی محلی از کلید --ignore-missing استفاده کنید."
          } > /tmp/cargo3/info
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for try in 1 2 3; do
            git fetch -q "$URL" "${GITHUB_REF_NAME}" || { sleep 4; continue; }
            git reset --hard FETCH_HEAD
            mkdir -p vizitor-app/dist
            cp /tmp/cargo3/apk "$R1"
            cp /tmp/cargo3/sha "$R2"
            cp /tmp/cargo3/sums "$R4"
            cp /tmp/cargo3/info "$R3"
            if [ -f /tmp/cargo3/mapk ]; then
              cp /tmp/cargo3/mapk "vizitor-app/dist/MReport-$APP_VERSION-direct.apk"
              cp /tmp/cargo3/msha "vizitor-app/dist/MReport-$APP_VERSION-direct.apk.sha256"
              git add -f "vizitor-app/dist/MReport-$APP_VERSION-direct.apk" \
                         "vizitor-app/dist/MReport-$APP_VERSION-direct.apk.sha256"
            fi
            git add -f "$R1" "$R2" "$R3" "$R4"
            git diff --cached --quiet && { echo "APK از قبل ثبت شده بود"; break; }
            git config user.name "vizitor-ci"
            git config user.email "ci@vizitor.local"
            git commit -q -m "chore(ci): APK امضاشدهٔ آتیران ویزیتور $APP_VERSION در مخزن [skip ci]"
            if git push "$URL" "HEAD:${GITHUB_REF_NAME}"; then echo "APK در مخزن ثبت شد ✓ (sha256: $HASH)"; break; fi
            echo "پوش رد شد (تلاش $try) — تلاش دوباره"
            sleep 4
          done
          # dist/ باید دقیقاً همان چیزی باشد که ثبت و منتشر می‌شود
          cp /tmp/cargo3/apk "$R1"
          cp /tmp/cargo3/sha "$R2"
          cp /tmp/cargo3/sums "$R4"
          cp /tmp/cargo3/info "$R3"
          # v2.21.0: نسخهٔ آزمون (debug) هم باید در dist بماند؛ ریلیز به آن نیاز دارد
          if [ -f "$DBG" ]; then
            cp "$DBG" "vizitor-app/dist/Vizitor-$APP_VERSION-direct-debug.apk"
          fi
          ls -l vizitor-app/dist/
          echo "sha ثبت‌شده: $HASH"

      - name: بارگذاری خروجی‌ها (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VizitorApp-Direct-APK
          path: vizitor-app/dist/*
          if-no-files-found: error

      - name: انتشار ریلیز با APK قابل دانلود
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vizitor-app-direct-${{ env.APP_VERSION }}
          name: "آتیران ویزیتور — نسخه ${{ env.APP_VERSION }} (نسخهٔ کامل ویزیتور + بخش «گزارش مدیریت» M•REPORT) با اتصال مستقیم SQL Server (پورت ۱۴۳۳)"
          body: |
            برنامهٔ اندروید **آتیران ویزیتور** با اتصال **مستقیم** به SQL Server روی پورت
            **۱۴۳۳** — بدون IIS و بدون API میانی، هماهنگ با نصب‌کنندهٔ ویندوز.

            | فایل | توضیح |
            |---|---|
            | `Vizitor-${{ env.APP_VERSION }}-direct.apk` | نسخهٔ امضاشده (این را روی گوشی‌ها نصب کنید) — شناخته‌شده به `${{ env.APP_VERSION }}-direct` (شمارهٔ ساخت ۲۱۹۱۹) |
            | `Vizitor-${{ env.APP_VERSION }}-direct-debug.apk` | نسخهٔ آزمون (در کنار نسخهٔ اصلی نصب می‌شود) |

                                    **تازه در نسخهٔ ۲٫۲۳٫۰ — اتصال کاملاً خودکار و مخفی (هیچ مشخصاتی از سرور دیده نمی‌شود)**
            * **کاربر هیچ اطلاعاتی از سرور نمی‌بیند:** صفحهٔ «اتصال و ورود» دیگر هیچ فیلد نشانی،
              پورت، دیتابیس یا کاربر SQL ندارد. تنها چیزی که کاربر وارد می‌کند **نام کاربری و
              کلمهٔ عبور خودش در برنامهٔ آتیران** است (تأیید واقعی با `dbo.sys_users`، فقط-خواندنی)
              و بعد گزارش‌ها با همان حساب به‌روزرسانی می‌شود.
            * **تشخیص هوشمند شبکه:** اگر گوشی روی **وای‌فای/کابل شبکهٔ اداره** باشد مسیر داخلی و
              اگر روی **دادهٔ همراه** باشد مسیر اینترنت خودکار امتحان می‌شود؛ اگر یکی جواب نداد،
              خودکار سراغ دیگری می‌رود (کاوش سریع TCP و بعد اتصال واقعی چهارحالته). مسیر موفق برای
              اجرای بعدی به‌خاطر سپرده می‌شود.
            * **اتصال بی‌کلیک در نسخهٔ انحصاری:** برنامه هنگام باز شدن خودش وصل می‌شود؛ اگر شبکهٔ
              گوشی عوض شود، در اجرای بعدی مسیر تازه انتخاب می‌شود.
            * **پیام‌ها و عیب‌یابی پوشانده‌شده:** خطاها و گام‌های «عیب‌یابی اتصال» پیش از نمایش
              پاک‌سازی می‌شوند؛ در آن‌ها فقط «سرور آتیران» و متن‌های راهنما دیده می‌شود — نه نشانی،
              نه پورت، نه نام کاربری و رمز.
            * **حساب کاربر برای سینک:** پس از ورود، حساب کاربر (نام، شناسهٔ ویزیتور و شرکت) مثل
              خود برنامه در حافظهٔ امن گوشی ذخیره می‌شود تا گزارش‌ها به نام همان کاربر بیاید.

            **تازه در نسخهٔ ۲٫۲۲٫۰ — نسخهٔ انحصاری حالا «کاملاً مشابه» برنامهٔ مرجع M•A Report است**
            * **خانهٔ «M•A Report» عیناً مثل برنامهٔ مرجع (`app-debug-40`):** نوار بالا با
              عنوان طلایی «M•A Report» و سه دکمهٔ گرد (تنظیمات هوشمند، هشدارها، جست‌وجو)،
              نوار شش بخش — **نمای کلی، مشتریان، کالاها، خزانه، گزارش‌ها، اعلان‌ها** —
              «نبض کسب‌وکار»، کارت «M•D Intelligence»، چهار کارت شاخص (گردش مالی، مشتریان،
              کالاها، چک‌ها)، «چارت‌های من»، نمودار «روند مطالبات و وصول طلب — ۸ ماه اخیر»،
              «Top Products Report» و پانویس مرجع (MEELANO STUDIO DESIGN · میلاد یعقوبی).
            * **برگهٔ «تنظیمات هوشمند»** با همان گروه‌های مرجع باز می‌شود و کاشی‌هایش کارِ
              واقعی می‌کنند: اتصال و همگام‌سازی، دریافت مجدد اطلاعات، فهرست جدول‌های سرور،
              اتصال جداول، گزارش‌ها، اشتراک و کپی متن گزارش.
            * **فقط دو چیز واقعاً «راه افتاده» (خواستهٔ خودتان):** **اتصال به دیتابیس** با
              همان موتور چهارحالته و **فراخوانی اطلاعات** — شمار رکوردها، مجموع مبلغ‌ها،
              برترین‌ها، روند ماهانه و مانده‌ها از جدول‌های نگاشت‌شدهٔ سرور.
            * **هیچ عدد ساختگی‌ای وجود ندارد:** هرجا دادهٔ واقعی در دسترس نباشد، همان متن
              دقیق مرجع نمایش داده می‌شود («دادهٔ فاکتور در دسترس نیست»، «ستون مبلغ این جدول
              تشخیص داده نشد»، «★ داده‌های این بخش صرفاً برای نمایش قابلیت‌های M•A Report است»).

            **نمای کلی نسخهٔ ۲٫۲۱٫۰ — «نسخهٔ انحصاری گزارشات مدیر» در کنار نسخهٔ کامل (دو برنامهٔ جدا)**
            * **دو برنامه از یک سورس:** علاوه بر برنامهٔ کامل «آتیران ویزیتور»، از همین نسخه
              یک **برنامهٔ جداگانهٔ سبک با نام «گزارشات مدیر»** (بستهٔ `ir.atiran.mreport`)
              منتشر می‌شود که فقط اتاق فرمان گزارش‌هاست — کنار برنامهٔ اصلی روی گوشی
              نصب می‌شود و روی هم نمی‌افتند. ریلیز جداگانه:
              `manager-reports-${{ env.APP_VERSION }}`.
            * **ورود مستقیم به گزارش‌ها:** نسخهٔ انحصاری بدون ویترین، سبد خرید، ثبت ویزیت،
              چت و همگام‌سازی پس‌زمینه بالا می‌آید؛ اولین اجرا مستقیماً روی برگهٔ
              «تنظیم اتصال» باز می‌شود و پیش‌فرض‌های همان برنامهٔ مرجع را از قبل دارد
              (`37.143.147.19` · پورت `1433` · دیتابیس `Atiran2` · کاربر `AdminAn`) — فقط
              رمز را وارد می‌کنید و «اتصال به سرور» را می‌زنید.
            * **سبک‌تر و ساده‌تر:** در نسخهٔ انحصاری دادهٔ نمونه، چت ویزیتور، چک‌ها و
              کارهای زمان‌بندی‌شدهٔ پس‌زمینه اجرا نمی‌شوند؛ فقط اتصال دقیق و پنج برگهٔ
              گزارش (نمای کلی، مرور داده‌ها، اتصال جداول، تنظیم اتصال، گزارش‌ها).
            * **همان کلید امضا:** هر دو برنامه با کلید همیشگی امضا می‌شوند، پس نسخه‌های
              بعدی هر کدام درجای خودشان به‌روزرسانی می‌شوند.

            **نمای کلی نسخهٔ ۲٫۲۰٫۰ — «گزارش مدیریت» هم‌شکل برنامهٔ مرجع + اتصال کاملاً دقیق**
            * **موتور اتصال دقیقاً مثل نسخهٔ مرجع (app-debug-40):** چهار حالت اتصال
              (Microsoft+TLS، Microsoft بدون TLS، jTDS، jTDS+TLS) که هر کدام جواب بدهد همان
              برنده است؛ پارس هوشمند هدف (`IP`، `SERVER\INSTANCE`، `IP:PORT`،
              `IP\INSTANCE:PORT`)؛ **کاوش خام TCP**، **کاوش PRELOGIN واقعی TDS**
              (پشت پورت، واقعاً SQL Server نشسته است؟)، **کاوش دست‌دادن TLS** با
              TLSv1.3/1.2/1.1/1.0 و **پرسیدن پورت واقعی نمونه از سرویس SQL Browser روی
              UDP 1434** با دکمهٔ «استفاده از این پورت». نگاشت خطاهای درایور به پیام فارسی
              (رمز اشتباه، دیتابیس بسته، حساب ویندوزی، خطای رمزنگاری، فیلترشدن پورت توسط
              اپراتور) — همان تجربهٔ «عیب‌یابی اتصال» مرجع، گام‌به‌گام.
            * **صفحهٔ تازهٔ «گزارش مدیریت (M•REPORT)»** با پنج برگه:
              **نمای کلی** (فهرست واقعی جدول‌های سرور با شمار رکورد هر جدول، جست‌وجوی نام
              جدول، حجم دیتابیس)، **مرور داده‌ها** (صفحه‌بندی واقعی با
              `ROW_NUMBER() OVER (ORDER BY (SELECT NULL))`، جست‌وجوی زنده در ستون‌های متنی،
              جزئیات کامل رکورد)، **اتصال جداول** (نگاشت پنج بخش گزارش — مشتریان، کالاها،
              فروش و فاکتورها، چک‌ها، بانک‌ها و حساب‌ها — به جدول‌های واقعی سرور با
              **تشخیص خودکار** از روی نام‌های حدسی فارسی/انگلیسی)، **تنظیم اتصال**
              (دو نشانی «شبکهٔ داخلی / اینترنت» + پورت + دیتابیس + کاربر و رمز) و
              **گزارش‌ها** (مجموع ستون مبلغ، برترین‌ها بر اساس مبلغ به‌صورت نمودار سه‌بعدی،
              آخرین رکوردها، اشتراک‌گذاری و کپی متن گزارش).
            * **نقش ستون‌ها هوشمند تشخیص داده می‌شود:** نام، مبلغ، تاریخ و کد هر جدول از روی
              نام و نوع ستون‌ها (الگوهای فارسی و انگلیسی) پیدا می‌شود و همان‌ها مبنای
              گزارش‌های مبلغ و «آخرین رکوردها» هستند.
            * **همه‌چیز فقط-خواندنی:** این بخش هیچ داده‌ای را در سرور تغییر نمی‌دهد
              («اتصال فقط-خواندنی است» — قاعدهٔ خود مرجع) و نگاشت جدول‌ها فقط روی همین گوشی
              ذخیره می‌شود.
            * **ورود از پنل مدیریت:** در «پنل مدیریت آتیران» یک کارت طلایی تازه
              («گزارش مدیریت (M•REPORT)») این صفحه را باز می‌کند؛ تنظیمات اتصال، نگاشت
              جدول‌ها و رمز (رمزنگاری‌شده با کلید سخت‌افزاری گوشی) بین دو صفحه مشترک است.
            * امضای همان کلید نسخه‌های قبلی — نصب روی گوشی‌های موجود **درجا** به‌روزرسانی می‌شود.

            **نمای کلی نسخهٔ ۲٫۱۹٫۰ — «اتصال ویزیتور» و «ارسال فاکتور» دقیقاً به سبک عکس‌های مرجع**
            * **صفحهٔ نخست (اتصال ویزیتور) بازسازی شد:** نوار بالا با عنوان طلایی و سه کرهٔ
              (تنظیمات هوشمند / هشدار با شمارنده / جست‌وجو)، نوار شش بخش
              (فعالیت‌ها، گزارش‌ها، خزانه، کالاها، مشتریان، نمای کلی) با کاشیِ فعالِ طلایی،
              تیتر قهرمان، جدول سه‌رنگِ «نبض اتصال ویزیتور»، کارت طلایی بزرگ برای اتصال
              و همگام‌سازی، چهار کارت شاخص و «برگهٔ تنظیمات هوشمند» با گروه‌های بازشو و
              کاشی‌های رنگی — همان چیدمان عکس‌های مرجع M•A Report.
            * **«نبض اتصال»:** شش ردیف وضعیت (اتصال آتیران، دیتابیس، ورود ویزیتور، اختیارات،
              سلامت مسیر سند و زمان پاسخ) با نوار سه‌رنگ سبز/کهربایی/قرمز که از دادهٔ
              واقعی سرور محاسبه می‌شود — نه عدد نمایشی.
            * **صفحهٔ «ارسال فاکتور» بازسازی شد:** کارت طلایی انتخاب مشتری، قرص‌های فیلتر اقلام
              (همه / موجودی کافی / کم‌موجود)، خلاصهٔ عددی، نوارهای سهمیهٔ اسناد
              (`TedadFactorMojazMande`) و اعتبار (`eteb`)، پنل امضای دیجیتال، کارت سند
              MEELANO با ردیف‌های «برچسب — مقدار»، **کاشی‌های خروجی واقعی**
              (اشتراک متن، تصویر، PDF، Word و گزارش‌ها — فایل‌ها با `InvoiceShare` ساخته و
              به اشتراک گذاشته می‌شوند)، کلید «ثبت واقعی در آتیران»، دکمهٔ طلایی ارسال و
              **کارت نتیجهٔ سند** با شمارهٔ سند (shfacfo)، تعداد اقلام نوشته‌شده و متن
              پیش‌نمایش.
            * **تحلیل کدبه‌کد کل پروژه (۷۰ فایل / ۲۷٬۲۶۲ خط):** سی‌وپنج تابع یا مقدار
              بدون فراخوان پیدا شد و مهم‌ترین‌ها **وصل شدند**: دستیار هوشمند فروش
              (قبلاً هیچ دکمه‌ای آن را صدا نمی‌زد)، کارت‌های شاخص مرجع، تشخیص کامل اتصال
              (درایور، پورت، دیتابیس و جدول‌های مسیر سند) و به‌روزرسانی فهرست ویزیتورها.
            * **رفع اشکال چیدمان:** ردیف‌های راهنمای پنل مدیریت و کارت‌های شاخص تازه داخل ستون
              قرار گرفتند تا هرگز روی هم نیفتند (اشکال «دو فرزند در یک آیتم لیست»).
            * **مسیر ثبت فاکتور دست‌نخورده و کامل:** گوشی (Room) → دروازهٔ واحد
              `VizitorGateway.submitCart` → `EXEC dbo.add_sail_pish` → اقلام در
              `dbo.subsailtemp_pish` (تریگر `trig_sst_pish`) → بازخوانی تأییدی از
              `subsailfact_pish ⋈ sailfact_pish`؛ تا وقتی پیش‌فاکتور مرجع در ERP نباشد،
              فقط «پیش‌نمایش سند» ساخته می‌شود و چیزی در سرور نوشته نمی‌شود.
            * امضای همان کلید نسخه‌های قبلی — نصب روی گوشی‌های موجود **درجا** به‌روزرسانی می‌شود.

            **نمای کلی نسخهٔ ۲٫۱۸٫۰ — اتصال و فراخوانی کامل + «همهٔ فعالیت‌های ویزیتور»**
            * **اتصال، خودترمیم شد:** اگر برنامه بسته و باز شود، دیگر خطای «قبل از هر کوئری باید
              اتصال برقرار باشد» نمی‌گیرید؛ هر بخش خودش با تنظیمات ذخیره‌شدهٔ گوشی اتصال را
              برقرار می‌کند. اتصال دوباره با همان تنظیمات، دوباره ساخته نمی‌شود (سریع‌تر و
              بدون قطع‌کردن کوئری در جریان) و اگر اتصال دیگری در جریان باشد، نتیجهٔ همان صبر
              می‌شود — نه «خطای نامشخص».
            * **فراخوانی، یک مسیر واحد:** پیش‌تر دکمه‌های «همگام‌سازی» و «تست اتصال» به API
              قدیمی (PHP) می‌رفتند که در این نسخهٔ نصبی وجود ندارد؛ حالا همه از دروازهٔ واحد
              **VizitorGateway** روی اتصال مستقیم SQL می‌روند. هیچ دکمه‌ای بی‌نتیجه نمی‌ماند.
            * **مسیر واقعی ثبت پیش‌فاکتور ERP فراخوانی می‌شود:**
              `EXEC dbo.add_sail_pish` + درج اقلام در `dbo.subsailtemp_pish` (تریگر
              `trig_sst_pish`) + بازخوانی تأییدی از `subsailfact_pish ⋈ sailfact_pish`، و در
              صورت شکست، «کنار گذاشتن» سند نیمه‌کاره با همان روش خودِ ERP
              (`active='f'`, `ismodify='t'`). تا وقتی پیش‌فاکتور مرجع در ERP نباشد، برنامه
              «پیش‌نمایش سند» می‌دهد و چیزی در سرور نمی‌نویسد — هیچ مقدار حدسی ثبت نمی‌شود.
            * **صفحهٔ تازهٔ «اطلاع‌رسانی اولیه به ویزیتور»:** وضعیت زندهٔ اتصال (درایور، تأخیر،
              دیتابیس، نسخهٔ سرور)، اختیارات خودِ ویزیتور (مشتری/کالا/انبار مجاز، سهمیهٔ
              `TedadFactorMojazMande`، اعتبار `eteb`، درصد نقدی/چکی)، ترکیب مشتریان
              (خوش‌حساب/بدهکار) و مسیرهای واقعی `dbo.masir` — همه از سرور، بدون عدد نمایشی.
              این صفحه **یک‌بار پس از ورود خودکار** باز می‌شود و از پیشخوان هم در دسترس است.
            * **صفحهٔ تازهٔ «فعالیت‌های ویزیتور»:** مرکز همهٔ کارهای روزمره — منوی سه‌بعدی
              ۱۲ فعالیت، نمودار ستونی سه‌بعدی «ویزیت‌های هفته» از `dbo.Visit`، جدول سه‌بعدی
              آخرین ویزیت‌ها، مطالبات در خطر، مسیرها و آخرین سند صادرشده.
            * **همگام‌سازی، همهٔ فعالیت‌ها را پوشش می‌دهد:** کالا، مشتری، فاکتور، **ویزیت‌های
              امروز**، **مسیرهای تعریف‌شده**، سهمیه و اعتبار — با گزارش فارسی در پایان کار.
            * **منو، چارت و جدول کاملاً سه‌بعدی:** کیت تازهٔ `Lux3D` —
              صحنهٔ سه‌بعدی با کف پرسپکتیوی، کاشی‌های منو با ضخامت و چرخش هنگام لمس،
              ستون‌های ایزومتریک (وجه روبرو/بالا/کنار + سایه + بازتاب کف)، دونات ضخیم
              سه‌بعدی، گوی‌های آماره (کره با نور نقطه‌ای و سایهٔ پایه) و جدول‌های
              سربرگ‌طلایی با ردیف‌های ضخامت‌دار — همه فقط با Canvas خودِ Compose،
              بدون کتابخانهٔ بیرونی و بدون سنگین‌شدن APK.
            * **کاشی‌های تازه در پیشخوان:** «اطلاع‌رسانی اولیه» و «همهٔ فعالیت‌ها».
            * **مسیر ثبت مشتری جدید، شفاف شد:** ثبت محلی در «انتظار تأیید حسابداری» با پیام
              روشن (ارسال خودکار به ERP در این نسخه فعال نیست، چون مسیر نوشتن مشتری هنوز
              روی سرور تأیید نشده — هیچ ادعای نادرستی نمایش داده نمی‌شود).
            * **زبانِ طراحی «گزارش طلایی»** (نسخهٔ ۲٫۱۷) و پنج تم قبلی، دست‌نخورده باقی مانده‌اند.
            * امضای همان کلید نسخه‌های قبلی — نصب روی گوشی‌های موجود **درجا** به‌روزرسانی می‌شود.

            طراحی و برنامه‌نویسی: **میلاد یقوبی** — گروه نرم‌افزاری **Meelano Studio Design**.
          files: |
            vizitor-app/dist/Vizitor-${{ env.APP_VERSION }}-direct.apk
            vizitor-app/dist/Vizitor-${{ env.APP_VERSION }}-direct.apk.sha256
            vizitor-app/dist/SHA256SUMS.txt
            vizitor-app/dist/Vizitor-${{ env.APP_VERSION }}-direct-debug.apk

      # ── v2.20.0 — ریلیز جداگانهٔ «نسخهٔ انحصاری گزارشات مدیر» ────────────────
      - name: انتشار ریلیز «گزارشات مدیر» (نسخهٔ انحصاری)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-reports-${{ env.APP_VERSION }}
          name: "گزارشات مدیر — نسخه ${{ env.APP_VERSION }} (نسخهٔ انحصاری، کاملاً مشابه M•A Report با اتصال و فراخوانی اطلاعات فعال)"
          # ریلیز اصلی (آتیران ویزیتور) در جایگاه «Latest» می‌ماند
          make_latest: "false"
          body: |
            **نسخهٔ انحصاری «گزارشات مدیر»** — همان صفحه‌های برنامهٔ مرجع
            «M•A Report» (`app-debug-40`)، فقط با اتصال دیتابیس و فراخوانی
            اطلاعاتِ واقعی.

            | فایل | توضیح |
            |---|---|
            | `MReport-${{ env.APP_VERSION }}-direct.apk` | نسخهٔ امضاشده — بستهٔ `ir.atiran.mreport` (شمارهٔ ساخت ۲۱۹۱۹) |
            | `MReport-${{ env.APP_VERSION }}-direct.apk.sha256` | اثر انگشت SHA-256 |

            **تازه در ۲٫۲۳٫۰ — اتصال خودکار و مخفی**
            * **هیچ مشخصاتی از سرور نمی‌بینید:** نشانی/پورت/دیتابیس/کاربر SQL نه در
              صفحه هست و نه لازم است وارد شود. فقط **نام کاربری و کلمهٔ عبور خودتان در
              برنامهٔ آتیران** را وارد می‌کنید (تأیید واقعی روی سرور، فقط-خواندنی) و
              گزارش‌ها با همان حساب به‌روزرسانی می‌شود.
            * **تشخیص هوشمند شبکه:** روی وای‌فای اداره، مسیر داخلی و روی اینترنت همراه،
              مسیر بیرونی خودکار انتخاب می‌شود؛ اگر یکی جواب نداد، خودکار دیگری امتحان
              می‌شود و مسیر موفق برای اجرای بعدی به‌خاطر سپرده می‌شود.
            * **اتصال بی‌کلیک:** برنامه هنگام باز شدن خودش وصل می‌شود و گزارش‌ها را
              می‌خواند؛ اگر شبکه عوض شود، اجرای بعدی خودش مسیر تازه را پیدا می‌کند.
            * **خطاها و عیب‌یابی، پوشانده‌شده:** در پیام‌ها فقط «سرور آتیران» و راهنما
              دیده می‌شود — نه نشانی، نه پورت و نه رمز.

            **۲٫۲۲٫۰ — کاملاً مشابه برنامهٔ مرجع**
            * **خانهٔ «M•A Report»:** نوار بالا با عنوان طلایی و سه دکمهٔ گرد
              (تنظیمات هوشمند، هشدار، جست‌وجو) + نوار شش بخش: نمای کلی، مشتریان،
              کالاها، خزانه، گزارش‌ها، اعلان‌ها — با همان کاشی طلایی فعال.
            * **«نبض کسب‌وکار»:** شش ردیف (مشتریان، مطالبات، چک‌ها، موجودی، سیستم،
              اتصال آتیران) با نوار و وضعیت رنگی، محاسبه‌شده از دادهٔ واقعی.
            * **کارت «M•D Intelligence»** و «Top Products Report»: اگر ستون مبلغ
              جدول فاکتور/کالا پیدا شود، نمودار واقعی؛ وگرنه همان متن دقیق مرجع
              («دادهٔ فاکتور در دسترس نیست» / «ستون مبلغ این جدول تشخیص داده نشد»).
            * **چهار کارت شاخص:** گردش مالی، مشتریان، کالاها، چک‌ها — با شمار رکورد
              و مجموع مبلغ‌های واقعی سرور و نام جدول نگاشت‌شده.
            * **«روند مطالبات و وصول طلب — ۸ ماه اخیر»:** نمودار خطی دومسیره که
              ماه‌ها را از ستون تاریخ و مبلغ‌ها را از ستون مبلغ خودِ دیتابیس می‌سازد.
            * **مشتریان و کالاها:** جست‌وجوی زنده، فهرست برترین‌ها از سرور، «توزیع
              سطح مشتریان» و «سهم هر مشتری» (دونات سه‌بعدی) از مبلغ‌های واقعی.
            * **خزانه:** سرجمع دریافتی/پرداختی، کاشی‌های نقد/پوز/چک و فهرست
              اسناد — با نگاشت جدول‌های چک و بانک.
            * **گزارش‌ها:** «Executive Summary» با اعداد واقعی + دکمه‌های
              اشتراک/کپی (کارکن) و Word/PDF (نمایشی) + «برنامه‌نویس • میلاد یعقوبی».
            * **اعلان‌ها:** هشدارهای واقعی وضعیت اتصال و نگاشت (وصل نشده، بخش‌های
              بدون جدول، جدول خالی) با فیلتر سرور/نگاشت/انجام‌شده.

            **اتصال به دیتابیس (فعال)**
            * چهار حالت اتصال (Microsoft+TLS، Microsoft بدون TLS، jTDS، jTDS+TLS)،
              پارس هدف (`IP`، `SERVER\INSTANCE`، `IP:PORT`، `IP\INSTANCE:PORT`)،
              کاوش خام TCP، کاوش PRELOGIN واقعی TDS، کاوش TLS (1.3→1.0)، پورت نمونه
              از SQL Browser روی UDP 1434 و «عیب‌یابی اتصال» گام‌به‌گام فارسی.
            * پیش‌فرض‌های آمادهٔ مرجع: `37.143.147.19` · `1433` · `Atiran2` ·
              کاربر `AdminAn` (فقط رمز را وارد می‌کنید) + نشانی داخلی `192.168.1.10`.
            * «اتصال جداول» برای نگاشت پنج بخش گزارش به جدول‌های واقعی سرور، با
              «تشخیص خودکار جداول» و تشخیص هوشمند نقش ستون‌ها (نام، مبلغ، تاریخ، کد).

            **فراخوانی اطلاعات (فعال)**
            * شمار رکورد و مجموع مبلغ هر بخش، برترین مشتریان/کالاها، آخرین رکوردها،
              روند ماهانه و صفحه‌بندی/جست‌وجوی زندهٔ داده‌ها — همه فقط-خواندنی
              (`SELECT` و کاتالوگ سیستم).

            **سبک و مستقل**
            * بدون ویترین، سبد خرید، ثبت ویزیت، چت و همگام‌سازی پس‌زمینه.
            * بستهٔ جدا (`ir.atiran.mreport`) ⇒ کنار «آتیران ویزیتور» نصب می‌شود؛
              با همان کلید امضا ⇒ به‌روزرسانی درجا.
            * برنامه مستقیماً روی خانهٔ «M•A Report» باز می‌شود و اگر وصل نباشد،
              دکمهٔ طلایی «اتصال به دیتابیس» جلوی چشم است.

            طراحی و برنامه‌نویسی: **میلاد یعقوبی** — گروه نرم‌افزاری **Meelano Studio Design**.

      - name: ضمیمهٔ قطعی فایل‌های APK روی ریلیزها
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            ok=1
            for f in "vizitor-app/dist/Vizitor-$APP_VERSION-direct.apk" \
                     "vizitor-app/dist/Vizitor-$APP_VERSION-direct.apk.sha256" \
                     "vizitor-app/dist/SHA256SUMS.txt" \
                     "vizitor-app/dist/Vizitor-$APP_VERSION-direct-debug.apk"; do
              [ -f "$f" ] || { echo "::warning::فایل $f موجود نیست"; continue; }
              gh release upload "vizitor-app-direct-$APP_VERSION" "$f" --clobber || ok=0
            done
            for f in "vizitor-app/dist/MReport-$APP_VERSION-direct.apk" \
                     "vizitor-app/dist/MReport-$APP_VERSION-direct.apk.sha256"; do
              [ -f "$f" ] || { echo "::warning::فایل $f موجود نیست"; continue; }
              gh release upload "manager-reports-$APP_VERSION" "$f" --clobber || ok=0
            done
            [ "$ok" = "1" ] && { echo "همهٔ فایل‌ها ضمیمه شدند ✓"; break; }
            echo "تلاش $i ناموفق — تلاش دوباره"; sleep 5
          done
          # فهرست نهایی دارایی‌ها را در مخزن ثبت می‌کنیم تا از بیرون قابل راستی‌آزمایی باشد
          {
            echo "فهرست دارایی‌های ریلیزها — نسخه $APP_VERSION"
            echo "تاریخ: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## ریلیز آتیران ویزیتور (vizitor-app-direct-$APP_VERSION)"
            gh release view "vizitor-app-direct-$APP_VERSION" --json assets \
              -q '.assets[] | "  \(.name) — \(.size) بایت"' || echo "  (خوانده نشد)"
            echo
            echo "## ریلیز گزارشات مدیر (manager-reports-$APP_VERSION)"
            gh release view "manager-reports-$APP_VERSION" --json assets \
              -q '.assets[] | "  \(.name) — \(.size) بایت"' || echo "  (خوانده نشد)"
          } > vizitor-app/release-assets.txt
          cat vizitor-app/release-assets.txt
          git config user.name "vizitor-ci"
          git config user.email "ci@vizitor.local"
          git add -f vizitor-app/release-assets.txt
          for try in 1 2 3; do
            git fetch -q "$URL" "${GITHUB_REF_NAME}" || { sleep 4; continue; }
            git reset --soft FETCH_HEAD || true
            git diff --cached --quiet && { echo "فهرست دارایی‌ها از قبل ثبت شده بود"; break; }
            git commit -q -m "chore(ci): فهرست دارایی‌های ریلیز $APP_VERSION [skip ci]" || true
            if git push "$URL" "HEAD:${GITHUB_REF_NAME}"; then echo "فهرست دارایی‌ها در مخزن ثبت شد ✓"; break; fi
            sleep 4
          done
