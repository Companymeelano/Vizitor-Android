      # ── v2.20.0 — ریلیز جداگانهٔ «نسخهٔ انحصاری گزارشات مدیر» ────────────────
      - name: انتشار ریلیز «گزارشات مدیر» (نسخهٔ انحصاری)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manager-reports-${{ env.APP_VERSION }}
          name: "گزارشات مدیر — نسخه ${{ env.APP_VERSION }} (نسخهٔ انحصاری M•REPORT با اتصال کاملاً دقیق چهارحالته)"
          # ریلیز اصلی (آتیران ویزیتور) در جایگاه «Latest» می‌ماند
          make_latest: "false"
          body: |
            **نسخهٔ انحصاری «گزارشات مدیر»** — برنامهٔ جداگانه و سبک، فقط برای گزارش‌های
            مدیریت؛ بر پایهٔ تحلیل کد‌به‌کد برنامهٔ مرجع پیوست (`app-debug-40.apk`).

            | فایل | توضیح |
            |---|---|
            | `MReport-${{ env.APP_VERSION }}-direct.apk` | نسخهٔ امضاشده — بستهٔ `ir.atiran.mreport` (شمارهٔ ساخت ۲۱۹۱۷) |
            | `MReport-${{ env.APP_VERSION }}-direct.apk.sha256` | اثر انگشت SHA-256 |

            **چه چیزی در این برنامه هست؟**
            * **اتصال کاملاً دقیق** مثل برنامهٔ مرجع: چهار حالت اتصال
              (Microsoft+TLS، Microsoft بدون TLS، jTDS، jTDS+TLS)، پارس هدف
              (`IP`، `SERVER\INSTANCE`، `IP:PORT`، `IP\INSTANCE:PORT`)، کاوش خام TCP،
              کاوش PRELOGIN واقعی TDS، کاوش TLS (1.3→1.0)، پیدا کردن پورت نمونه از
              سرویس SQL Browser روی UDP 1434 و «عیب‌یابی اتصال» گام‌به‌گام فارسی.
            * **پنج برگهٔ گزارش:** نمای کلی (فهرست جدول‌ها + شمار رکورد + حجم دیتابیس)،
              مرور داده‌ها (صفحه‌بندی + جست‌وجوی زنده + جزئیات رکورد)، اتصال جداول
              (نگاشت پنج بخش با «تشخیص خودکار جداول»)، تنظیم اتصال (دو نشانی داخلی/اینترنت)
              و گزارش‌ها (مجموع ستون مبلغ، برترین‌ها با نمودار سه‌بعدی، آخرین رکوردها،
              اشتراک‌گذاری و کپی متن گزارش).
            * **پیش‌فرض‌های آمادهٔ مرجع** در اولین اجرا: `37.143.147.19` · `1433` ·
              `Atiran2` · کاربر `AdminAn` (رمز را خودتان وارد می‌کنید) و برنامه مستقیماً
              روی برگهٔ «تنظیم اتصال» باز می‌شود.
            * **سبک و بدون شلوغی:** بدون ویترین، سبد خرید، ثبت ویزیت، چت و همگام‌سازی
              پس‌زمینه؛ فقط اتصال و گزارش‌ها (همین باعث می‌شود سبک‌تر و ساده‌تر باشد).
            * **بستهٔ جدا:** این برنامه کنار «آتیران ویزیتور» نصب می‌شود (روی هم نمی‌افتند)
              و با همان کلید امضای همیشگی امضا شده است، پس نسخه‌های بعدی خودش درجا
              به‌روزرسانی می‌شوند.
            * **فقط-خواندنی:** هیچ داده‌ای روی سرور تغییر نمی‌کند (قاعدهٔ خود مرجع).

            طراحی و برنامه‌نویسی: **میلاد یقوبی** — گروه نرم‌افزاری **Meelano Studio Design**.
